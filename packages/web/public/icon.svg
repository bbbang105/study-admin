<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0091FF"/>
      <stop offset="100%" stop-color="#004DFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#0a0a0a"/>
  <!--
    K lettermark with writing motif.
    Bold geometric "K" using KUSITMS blue gradient.
    The right strokes of K are slightly tapered like pen strokes.
  -->
  <g fill="url(#icon-grad)">
    <!-- Vertical stem of K -->
    <rect x="136" y="120" width="48" height="272" rx="8"/>
    <!-- Upper diagonal stroke (pen-like taper: thicker at junction, thinner at tip) -->
    <polygon points="184,268 184,228 340,120 356,120 356,152"/>
    <!-- Lower diagonal stroke (pen-like taper: thicker at junction, thinner at tip) -->
    <polygon points="184,268 184,308 340,392 356,392 356,360"/>
    <!-- Small pen-nib detail at the tip of lower stroke -->
    <circle cx="348" cy="392" r="10"/>
  </g>
</svg>
